<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">My Blog</a>

        <button class="btn btn-light">Home</button>
        <button class="btn btn-light">About</button>
        <button class="btn btn-light">Contact</button>
    </div>
</nav>


<!-- Heading -->
<div class="container text-center my-5">
    <h1>Welcome to My Blog</h1>
    <p class="text-muted">Simple and Responsive Blog</p>
</div>


<!-- Blog Cards -->
<div class="container">
    <div class="row">

        <!-- Card 1 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Web Development</h3>
                    <p class="card-text">
                        Learn HTML, CSS and JavaScript easily.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>


        <!-- Card 2 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Bootstrap 5</h3>
                    <p class="card-text">
                        Create beautiful websites using Bootstrap.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>


        <!-- Card 3 -->
        <div class="col-md-4 mb-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Technology</h3>
                    <p class="card-text">
                        Discover new technologies and trends.
                    </p>
                    <button class="btn btn-primary">Read More</button>
                </div>
            </div>
        </div>

    </div>
</div>


<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
    <p>© 2026 My Blog</p>
</footer>

</body>
</html>
